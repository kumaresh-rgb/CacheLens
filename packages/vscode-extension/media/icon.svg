<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Activity Bar icon: cache entries (the stacked bars) seen through a lens (the ring).

    Monochrome by requirement, not by preference — VS Code themes this icon itself and flattens
    any color we supply, so a colored version would break in high-contrast themes. The full-color
    version of the same mark lives in media/logo.svg.

    Tuned to read at 24px: one bold ring, three bars of unequal width (so it reads as *data*, not
    as a hamburger), and an index tick at the ring's edge the way a real lens barrel is marked.
  -->
  <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.6"/>
  <path d="M7.75 9.25h8.5M7.75 12h5.25M7.75 14.75h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 1.5v2.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
