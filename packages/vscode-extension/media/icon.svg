<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Activity Bar icon: cache entries (the stacked bars) seen through a lens (the ring).

    Monochrome by requirement, not by preference — VS Code themes this icon itself and flattens
    any color we supply, so a colored version would break in high-contrast themes. The full-color
    version of the same mark lives in media/logo.svg, which keeps the "index tick" this one drops
    below — at 128px it reads fine, but at 24px in the Activity Bar it broke the vertical symmetry
    every neighboring codicon has (nothing balancing it below the ring), which is what reads as
    "wrong size" next to icons that are all optically centered. Dropped it here in favor of a
    ring that actually sits centered in the 24x24 box.
  -->
  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
  <path d="M7 8.5h10M7 12h7M7 15.5h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
