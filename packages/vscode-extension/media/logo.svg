<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    CacheLens brand mark. Same geometry as the monochrome Activity Bar icon
    (media/icon.svg) so the two read as one mark.

    Deliberately restrained: a single amber identity colour with one teal accent
    on the shortest bar, rather than a full spectrum sweep. At 128px in a
    marketplace grid, a multi-colour gradient reads as decoration; two colours
    with strong contrast read as a considered mark.

    Colours are the brand tokens from docs/brand.md — warm amber #F2A93B for
    cache warmth, coating teal #37D6AE as the accent, on lens-barrel #0A0F0D.
  -->
  <defs>
    <linearGradient id="cl-ring" x1="30" y1="26" x2="98" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC163"/>
      <stop offset="1" stop-color="#E8912B"/>
    </linearGradient>
    <linearGradient id="cl-ground" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A17"/>
      <stop offset="1" stop-color="#070C0B"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#cl-ground)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- the lens -->
  <circle cx="64" cy="64" r="39" stroke="url(#cl-ring)" stroke-width="8"/>

  <!-- cache entries: unequal widths so the mark reads as data, not as a menu glyph -->
  <path d="M44 51h40" stroke="#F2FAF6" stroke-width="8" stroke-linecap="round"/>
  <path d="M44 64h25" stroke="#F2FAF6" stroke-width="8" stroke-linecap="round" stroke-opacity="0.82"/>
  <path d="M44 77h33" stroke="#37D6AE" stroke-width="8" stroke-linecap="round"/>
</svg>
